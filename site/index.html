  <button class="ib" id="bLink" type="button" aria-pressed="false"></button>

<noscript><p style="text-align:center"><a href="/posts">كل البوستات · All posts</a></p></noscript>
</div>
<script>
const P=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="${d}"/></svg>`;
const IC={

 all:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
 ai:'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z',
 mcp:'M8.5 12a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM20.5 6a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM20.5 18a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM8.2 11l7.6-4M8.2 13l7.6 4',
 addins:'M4 4h16v16H4zM12 8v8M8 12h8',
 opensource:'M9 7l-5 5 5 5M15 7l5 5-5 5',
 courses:'M3 9l9-4 9 4-9 4zM7 11v5c3 2 7 2 10 0v-5',
 ideas:'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V15h8v-1.5A6 6 0 0 0 12 3z',
 tools:'M4 5h16v14H4zM4 10h16M10 5v14',
 search:'M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0zM20 20l-3.5-3.5',
 mark:'M6 4h12v16l-6-4-6 4z',
 globe:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',
 moon:'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z',
 sun:'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5',
 share:'M4 12l16-8-6 16-3-7z',

 check:'M5 12.5l4.5 4.5L19 7',
 tag:'M3 12V4h8l9 9-8 8zM7.5 7.5v.01',
 x:'M6 6l12 12M18 6L6 18',

const GO='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3H3v10h10v-3M9 3h4v4M13 3 7 9"/></svg>';
const LI='<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.6 5.9h1.9V13H3.6zM4.55 2.9a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2zM6.9 5.9h1.8v1h.03c.25-.48.87-.98 1.8-.98 1.92 0 2.27 1.26 2.27 2.9V13h-1.9V9.2c0-.7-.01-1.6-.98-1.6-.98 0-1.13.77-1.13 1.55V13H6.9z"/></svg>';
const BG={all:'#EEF1F8',ai:'#DDE9FB',mcp:'#E6E0FA',addins:'#FBE5D6',opensource:'#D9F0E4',courses:'#FBEFC9',ideas:'#F8DDEA',tools:'#E4EDCB'};
const DK={all:'#20252F',ai:'#20252F',mcp:'#20252F',addins:'#20252F',opensource:'#20252F',courses:'#20252F',ideas:'#20252F',tools:'#20252F'};
const AC={all:'#B9C2D3',ai:'#8FB4E8',mcp:'#B3A6E6',addins:'#E3A982',opensource:'#86CDB0',courses:'#DCC577',ideas:'#E39BB6',tools:'#B5CB85'};
const VARS=id=>`--pl:${BG[id]||BG.all};--dk:${DK[id]||DK.all};--ac:${AC[id]||AC.all}`;
const SEC={
 ar:{all:'الكل',ai:'AI',mcp:'MCP',addins:'Add-ins',opensource:'Open Source',courses:'كورسات',ideas:'أفكار',tools:'أدوات'},
 en:{all:'All',ai:'AI',mcp:'MCP',addins:'Add-ins',opensource:'Open Source',courses:'Courses',ideas:'Ideas',tools:'Tools'}
};
const STR={
 ar:{search:'بحث',expandAll:'افتح الكل',collapseAll:'اقفل الكل',guide:'إزاي تستخدم الموقع',hint:'أداة، شخص، أو كلمة',saved:'المحفوظ',tagsT:'التاجز المختارة',clearTags:'امسح التاجز',removeTag:'شيل التاج',matchN:'مطابق',links:'البوستات اللي فيها لينك أداة',withLink:'فيها لينك أداة',switchTo:'Switch to English',other:'EN',dark:'الوضع الغامق',light:'الوضع الفاتح',openTool:'افتح الأداة',openPost:'افتح البوست على LinkedIn',share:'ابعته لزميل',copied:'اللينك اتنسخ',info:'اعرض الوصف',save:'احفظ البوست',unsave:'شيله من المحفوظ',isNew:'جديد',newN:'جديد',savedN:'محفوظ',updated:'آخر تحديث',posts:'بوست',noSaved:'لسه ماحفظتش حاجة. دوس على علامة الحفظ في أي بوست.',noMatch:'مفيش بوستات مطابقة.',more:'اعرض أكتر',left:'باقي',err:'ملف البيانات مش موجود أو فيه خطأ.',note:'المصدر: بوستات LinkedIn. التاريخ تقريبي حسب عمر البوست وقت المسح.'},
 en:{search:'Search',expandAll:'Expand all',collapseAll:'Collapse all',guide:'How to use RadioBIM',hint:'Tool, person or keyword',saved:'Saved',tagsT:'Selected tags',clearTags:'Clear tags',removeTag:'Remove tag',matchN:'matching',links:'Posts with a tool link',withLink:'with a tool link',switchTo:'التحويل للعربي',other:'ع',dark:'Dark mode',light:'Light mode',openTool:'Open the tool',openPost:'Open the post on LinkedIn',share:'Send to a colleague',copied:'Link copied',info:'Show description',save:'Save post',unsave:'Remove from saved',isNew:'New',newN:'new',savedN:'saved',updated:'Updated',posts:'posts',noSaved:'Nothing saved yet. Tap the bookmark on any post.',noMatch:'No posts match.',more:'Show more',left:'left',err:'The data file is missing or broken.',note:'Source: LinkedIn posts. Dates are approximate, based on post age at scan time.'}
};
const H=document.documentElement, $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=null, lang=H.lang==='ar'?'ar':'en', sec='all', onlySaved=false, onlyLink=false, searching=false, q='', limit=30;
let saved=new Set(); try{saved=new Set(JSON.parse(store.get('rbSaved')||'[]'))}catch(e){}
const open=new Set(), tagsOn=new Set();
const tagOk=i=>{if(!tagsOn.size) return true; const tg=i.tags||[]; for(const x of tagsOn) if(!tg.includes(x)) return false; return true;}; let copiedId=null, copiedT=0;
const L=()=>STR[lang];
const fmt=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString(lang==='ar'?'ar-EG-u-nu-latn':'en-GB',{day:'numeric',month:'long'})}catch(e){return d}};
const isNew=i=>i.added&&i.added!=='baseline'&&i.added>=DATA.updated;
const T=i=>lang==='en'&&i.title_en?i.title_en:i.title, D=i=>lang==='en'&&i.desc_en?i.desc_en:i.desc;

function chrome(){
  const s=L(), dark=H.dataset.theme==='dark';
  $('bSearch').innerHTML=P(IC.search); $('bGuide').innerHTML=P(IC.guide); $('bGuide').setAttribute('aria-label',s.guide); $('bGuide').title=s.guide; $('bGuide').href=(/radiobim\.com$/.test(location.hostname)||location.hostname==='localhost'?'guide.html':'https://radiobim.com/guide.html')+'?lang='+lang; $('bGuide').target=/radiobim\.com$/.test(location.hostname)||location.hostname==='localhost'?'_self':'_blank'; $('bSearch').setAttribute('aria-label',s.search); $('bSearch').title=s.search; $('bSearch').setAttribute('aria-pressed',searching);
  $('bSaved').innerHTML=P(IC.mark).replace('fill="none"',`fill="${onlySaved?'currentColor':'none'}"`)+(saved.size?`<em class="cnt">${saved.size}</em>`:'');
  $('bLink').innerHTML=P(IC.link); $('bLink').setAttribute('aria-label',s.links); $('bLink').title=s.links; $('bLink').setAttribute('aria-pressed',onlyLink); $('bSaved').setAttribute('aria-label',s.saved+': '+saved.size); $('bSaved').title=s.saved; $('bSaved').setAttribute('aria-pressed',onlySaved);
  $('bLang').innerHTML=P(IC.globe); $('bLang').setAttribute('aria-label',s.switchTo); $('bLang').title=s.switchTo;
  $('bTheme').innerHTML=P(dark?IC.sun:IC.moon); $('bTheme').setAttribute('aria-label',dark?s.light:s.dark); $('bTheme').title=dark?s.light:s.dark; $('bTheme').setAttribute('aria-pressed',dark);
  const row=$('searchRow'); row.hidden=!searching;
  if(searching&&!row.firstChild){row.innerHTML=P(IC.search)+'<input type="search" id="q">'; $('q').addEventListener('input',e=>{q=e.target.value; limit=30; tiles(); render();});}
  if(searching){$('q').placeholder=s.hint; $('q').setAttribute('aria-label',s.search); if($('q').value!==q) $('q').value=q;}
  if(DATA){$('foot').innerHTML=esc(s.note)+' · <a href="/posts">'+(lang==='ar'?'أرشيف كل البوستات':'All posts archive')+'</a> · <a href="guide.html">'+(lang==='ar'?'الدليل':'Guide')+'</a>';}
}
function match(i){
  if(onlySaved&&!saved.has(i.id)) return false;
  if(onlyLink&&!i.link) return false;
  if(!tagOk(i)) return false;
  const k=q.trim().toLowerCase(); if(!k) return true;
  return [i.title,i.desc,i.title_en,i.desc_en,i.a,(i.tags||[]).join(' ')].join(' ').toLowerCase().includes(k);
}
function tiles(){
  const s=L(), ids=['all'].concat(DATA.sections.map(x=>x.id));
  $('tiles').innerHTML=ids.map(id=>{
    const inSec=DATA.items.filter(i=>id==='all'||i.c===id);
    const tot=inSec.filter(i=>(!onlySaved||saved.has(i.id))&&(!onlyLink||i.link)&&tagOk(i)).length, n=inSec.filter(isNew).length;
    const name=SEC[lang][id]||id;
    return `<button type="button" class="tile" data-s="${esc(id)}" aria-pressed="${sec===id}" aria-label="${esc(name)}, ${tot} ${s.posts}${n?`, ${n} ${s.newN}`:''}" style="${VARS(id)}">${P(IC[id]||IC.all)}<span class="nm"><b>${esc(name)}</b><small>${tot}</small></span>${n?`<em>${n}</em>`:''}</button>`;
  }).join('');
}
function card(i){
  const s=L(), sv=saved.has(i.id), op=open.has(i.id), cp=copiedId===i.id;
  return `<article class="card" data-card="${esc(i.id)}" style="${VARS(i.c)}">
  <div class="top"><span class="ic" aria-hidden="true">${P(IC[i.c]||IC.all)}</span>
   <div style="min-width:0"><h3 dir="${lang==='en'&&i.title_en?'ltr':'rtl'}">${esc(T(i))}</h3><span class="by">${isNew(i)?`<b>${s.isNew}</b>`:''}<bdi>${esc(String(i.a||'').replace(/^[.\s]+/,''))}</bdi> · <bdi>${fmt(i.date)}</bdi></span></div></div>
  <div class="acts">
   <span class="grp">
   <button type="button" class="ab" data-info="${esc(i.id)}" aria-expanded="${op}" aria-label="${s.info}" title="${s.info}">${P(IC.info)}</button>
   <a class="ab" href="${esc(i.url)}" target="_blank" rel="noopener" aria-label="${s.openPost}" title="${s.openPost}">${LI}</a>
   <button type="button" class="ab${cp?' done':''}" data-share="${esc(i.id)}" aria-label="${cp?s.copied:s.share}" title="${cp?s.copied:s.share}">${P(cp?IC.check:IC.share)}</button>
   ${i.link?`<a class="ab tool" href="${esc(i.link)}" target="_blank" rel="noopener" aria-label="${s.openTool}" title="${s.openTool}${i.linkLabel?': '+esc(i.linkLabel):''}">${GO}</a>`:''}
   </span>
   <button type="button" class="ab save" data-save="${esc(i.id)}" aria-pressed="${sv}" aria-label="${sv?s.unsave:s.save}" title="${sv?s.unsave:s.save}">${P(IC.mark).replace('fill="none"',`fill="${sv?'currentColor':'none'}"`)}</button>
  </div>
  ${op?`<div class="more"><p dir="${lang==='en'&&i.desc_en?'ltr':'rtl'}">${esc(D(i))}</p>${(i.tags&&i.tags.length)?`<div class="tags">${i.tags.map(t=>`<button type="button" data-tag="${esc(t)}" aria-pressed="${tagsOn.has(t)}">${esc(t)}</button>`).join('')}</div>`:''}</div>`:''}
 </article>`;
}
function eqRows(){
  const cs=[...document.querySelectorAll('#out .list [data-card]')]; if(!cs.length) return;
  cs.forEach(c=>c.style.minHeight='');
  const rows=new Map();
  cs.forEach(c=>{const m=c.querySelector('.more'); const extra=m?m.offsetHeight+4:0; const k=c.offsetTop; if(!rows.has(k)) rows.set(k,[]); rows.get(k).push([c,c.offsetHeight-extra,extra]);});
  rows.forEach(r=>{if(r.length<2) return; const mx=Math.max(...r.map(x=>x[1])); r.forEach(([c,h,ex])=>{c.style.minHeight=(mx+ex)+'px';});});
}
let eqT=0; window.addEventListener('resize',()=>{clearTimeout(eqT); eqT=setTimeout(eqRows,120);});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>eqRows());
if(document.fonts&&document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',()=>eqRows());
window.addEventListener('load',()=>eqRows());
function render(){
  const s=L();
  const list=DATA.items.filter(i=>(sec==='all'||i.c===sec)&&match(i)).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.added).localeCompare(String(a.added)));
  if(!list.length){$('out').innerHTML=`<p class="empty">${onlySaved&&!saved.size?s.noSaved:s.noMatch}</p>`; return;}
  const rest=list.length-limit;
  const shown=list.slice(0,limit), allOpen=shown.length>0&&shown.every(i=>open.has(i.id));
  $('out').innerHTML=`<div class="lbar"><button type="button" class="xall" id="xAll" aria-label="${allOpen?s.collapseAll:s.expandAll}" title="${allOpen?s.collapseAll:s.expandAll}">${P(allOpen?IC.collapse:IC.expand)}<span>${allOpen?s.collapseAll:s.expandAll}</span></button></div><div class="list">${shown.map(card).join('')}</div>`+(rest>0?`<button type="button" class="loadmore" id="more">${s.more} (${s.left} ${rest})</button>`:''); eqRows();
}
function tagbar(){
  const s=L(), el=$('tagSel'); el.hidden=!tagsOn.size; if(!tagsOn.size){el.innerHTML=''; return;}
  el.setAttribute('aria-label',s.tagsT);
  el.innerHTML=P(IC.tag)+[...tagsOn].map(x=>`<button type="button" class="t" data-untag="${esc(x)}" aria-label="${s.removeTag}: ${esc(x)}" title="${s.removeTag}">${esc(x)}${P(IC.x)}</button>`).join('')+`<button type="button" class="clr" id="clrTags">${P(IC.x)}${s.clearTags}</button>`;
}
function all(){chrome(); tagbar(); if(DATA){tiles(); render();}}
function setLang(l){lang=l; H.lang=l; H.dir=l==='ar'?'rtl':'ltr'; store.set('rbLang',l); document.title=l==='ar'?'RadioBIM — أدوات وأفكار AEC من LinkedIn':'RadioBIM — AEC tools & ideas from LinkedIn'; all();}

$('bSearch').onclick=()=>{searching=!searching; if(!searching){q='';} limit=30; all(); if(searching) $('q').focus();};
$('bSaved').onclick=()=>{onlySaved=!onlySaved; limit=30; all();};
$('bLink').onclick=()=>{onlyLink=!onlyLink; limit=30; all();};
$('bLang').onclick=()=>setLang(lang==='ar'?'en':'ar');
$('bTheme').onclick=()=>{const t=H.dataset.theme==='dark'?'light':'dark'; H.dataset.theme=t; store.set('rbTheme',t); chrome();};
$('tagSel').onclick=e=>{const b=e.target.closest('button'); if(!b) return; if(b.id==='clrTags') tagsOn.clear(); else if(b.dataset.untag) tagsOn.delete(b.dataset.untag); limit=30; tagbar(); tiles(); render();};
$('tiles').onclick=e=>{const b=e.target.closest('[data-s]'); if(!b) return; sec=b.dataset.s; limit=30; tiles(); render();};
$('out').onclick=async e=>{
  const b=e.target.closest('button');
  if(!b){ if(e.target.closest('a')) return; const c=e.target.closest('[data-card]'); if(!c) return; if(String(window.getSelection&&getSelection())) return; const id=c.dataset.card; open.has(id)?open.delete(id):open.add(id); render(); return; }
  if(b.id==='more'){limit+=30; render(); return;}
  if(b.id==='xAll'){const ids=[...document.querySelectorAll('#out [data-card]')].map(x=>x.dataset.card); const all=ids.length&&ids.every(id=>open.has(id)); ids.forEach(id=>all?open.delete(id):open.add(id)); render(); return;}
  if(b.dataset.save){const id=b.dataset.save; saved.has(id)?saved.delete(id):saved.add(id); store.set('rbSaved',JSON.stringify([...saved])); all(); return;}
  if(b.dataset.info){const id=b.dataset.info; open.has(id)?open.delete(id):open.add(id); render(); return;}
  if(b.dataset.tag){const x=b.dataset.tag; tagsOn.has(x)?tagsOn.delete(x):tagsOn.add(x); limit=30; tagbar(); tiles(); render(); return;}
  if(b.dataset.share){
    const i=DATA.items.find(x=>x.id===b.dataset.share); if(!i) return;
    try{ if(navigator.share){await navigator.share({title:T(i),text:T(i),url:i.url}); return;} }catch(err){ if(err&&err.name==='AbortError') return; }
    copiedId=i.id; render(); clearTimeout(copiedT); copiedT=setTimeout(()=>{copiedId=null; render();},1800);
    try{await navigator.clipboard.writeText(T(i)+'\n'+i.url)}catch(err){
      const ta=document.createElement('textarea'); ta.value=T(i)+'\n'+i.url; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy')}catch(e2){} ta.remove();
    }
  }
};
try{const mq=matchMedia('(prefers-color-scheme: dark)');const follow=e=>{const t=store.get('rbTheme');if(t!=='dark'&&t!=='light'){H.dataset.theme=e.matches?'dark':'light';chrome();}};mq.addEventListener?mq.addEventListener('change',follow):mq.addListener(follow);}catch(e){}
chrome();
fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok) throw 0; return r.json();}).catch(()=>fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json())).then(d=>{DATA=d; setLang(lang);}).catch(()=>{$('out').innerHTML=`<p class="empty">${L().err}</p>`});
</script>
